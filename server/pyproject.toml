[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-agent-server"
version = "0.2.0"
description = "AI 漫剧 Agent 服务端"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "langgraph==1.2.9",
    "langchain==1.3.14",
    "langchain-openai==1.4.0",
    "langchain-community==0.4.2",
    "openai==2.46.0",
    "ffmpeg-python==0.2.0",
    "edge-tts==7.2.8",
    "Pillow==12.3.0",
    "aiohttp==3.14.3",
    "aiofiles==25.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "python-dotenv==1.2.2",
    "websockets==15.0.1",
    "httpx==0.28.1",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "agent*", "db*", "memory*", "models*", "rag*", "services*"]
exclude = ["scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 起步规则集:pyflakes(F) + pycodestyle(E/W) + isort(I) + bugbear(B) + pyupgrade(UP)。
# 有意不启用 RUF100(存量 # noqa 较多)与 E501(长中文注释靠 format 兜底,不逐一拆行)。
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501", # 行长由 ruff format 负责可换行代码;超长注释/字符串不强制拆行
    "B008", # FastAPI 惯用法:参数默认值中调用 Query/Depends 等
    "UP015", # 无谓的 open(mode="r") 显式参数保留,更贴近原风格
    "UP042", # str+Enum → StrEnum 会改变 str(member)/f-string 的取值行为,存量契约按 .value 序列化,迁移需单独评估
]

[tool.ruff.lint.isort]
known-first-party = ["api", "agent", "db", "memory", "models", "rag", "services", "tests"]

[tool.ruff.lint.per-file-ignores]
# 测试代码允许相对宽松的导入顺序与长断言
"tests/**" = ["E402"]
