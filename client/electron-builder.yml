# Keep the application archive small and deterministic. Vite bundles the
# renderer and Electron entry points, so source files and node_modules are not
# needed at runtime.
appId: com.comicagent.desktop
productName: ComicAgent
asar: true
compression: normal
directories:
  output: release
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!node_modules/**/*'
extraResources:
  # The desktop main process starts this source tree with the bundled Python
  # runtime. Runtime data is redirected to Electron's userData directory.
  - from: ../server
    to: server
    filter:
      - '**/*'
      - '!data/model_api_config.json'
      - '!data/*.db'
      - '!data/*.db-*'
      - '!data/chromadb/**'
      - '!data/checkpoints/**'
      - '!data/uploads/**'
      - '!**/.env'
      - '!**/.env.*'
      - '!**/.venv/**'
      - '!**/venv/**'
      - '!**/__pycache__/**'
      - '!**/*.py[cod]'
      - '!**/.pytest_cache/**'
      - '!**/.mypy_cache/**'
      - '!**/.ruff_cache/**'
      - '!**/.claude/**'
      - '!**/comic_agent_server.egg-info/**'
      - '!**/test_*.py'
      - '!tests/**'
      - '!scripts/**'
  # Relocatable python-build-standalone runtime with production dependencies
  # preinstalled, produced by `node scripts/build-python-runtime.mjs`. The
  # unpacked size is dominated by native wheels, so never let it enter the
  # asar (it lives in extraResources by design).
  - from: build/python
    to: python
  # Pinned static ffmpeg per platform; the main process prepends this
  # directory to PATH so the server's shutil.which("ffmpeg") finds it.
  - from: build/bin
    to: bin
  - from: build/THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
# Each matrix runner builds for its own architecture; native Python wheels
# make a macOS universal2 build impossible.
mac:
  target:
    - dmg
    - zip
  category: public.app-category.entertainment
  # Notarization rejects the bundle if any nested Mach-O binary is unsigned,
  # so the bundled Python runtime and ffmpeg must go through codesign too
  # (paths are relative to the .app Contents/ directory). Signing itself is
  # driven by CSC_LINK/CSC_KEY_PASSWORD + APPLE_* env vars in the release
  # workflow; hardening entitlements stay off because the Python child
  # process is spawned outside the app sandbox.
  binaries:
    - Resources/python/bin/python3
    - Resources/python/lib/libpython3.11.dylib
    - Resources/python/lib/python3.11/lib-dynload/*.so
    - Resources/python/lib/python3.11/site-packages/*.so
    - Resources/python/lib/python3.11/site-packages/*/*.so
    - Resources/bin/ffmpeg
win:
  target:
    - nsis
    - zip
publish:
  provider: github
  owner: robiteame
  repo: ComicAgent
