name: CI

# Also callable as the release test gate (release.yml `uses:`), so a tag can
# never publish installers that have not passed the same checks as master.
on:
  push:
    branches: [master, main, 'codex/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Test the documented minimum runtime; newer versions remain covered
          # by the universal hashed lock resolution.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements-dev.lock
      - name: Install server dependencies
        run: |
          python -m pip install --require-hashes -r server/requirements-dev.lock
          python -m pip install -e server --no-deps
      - name: Lint server (ruff)
        run: |
          python -m ruff check server
          python -m ruff format --check server
      # A few regression tests exercise real encodes via shutil.which("ffmpeg").
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Compile Python modules
        run: python -m compileall -q server
      - name: Run regression tests
        env:
          PYTHONPATH: server
        # -t makes discovery import the tests package first, so
        # tests/__init__.py sets up the sandboxed environment before any
        # test module binds settings to the real repository directories.
        run: python -m unittest discover -s server/tests -t server -p 'test_*.py' -v
      - name: Server coverage report (non-blocking)
        continue-on-error: true
        env:
          PYTHONPATH: server
        run: |
          python -m coverage run --source=server -m unittest discover -s server/tests -t server -p 'test_*.py'
          python -m coverage report | tee coverage.txt
          {
            echo '### Server coverage (non-blocking)'
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run pytest collection
        run: python -m pytest -q

  client:
    name: Client checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint client (biome)
        run: pnpm exec biome check client package.json
      - name: Check source file sizes
        run: node scripts/check-file-sizes.mjs
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Typecheck
        run: pnpm --dir client run typecheck
      - name: Run client tests
        run: pnpm --dir client run test
      - name: Client coverage report (non-blocking)
        continue-on-error: true
        run: |
          pnpm --dir client exec vitest run --coverage --coverage.reporter=text | tee coverage.txt
          {
            echo '### Client coverage (non-blocking)'
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build web bundle
        run: pnpm --dir client run build:web
      - name: Build unpacked Electron app
        run: pnpm --dir client run build:electron:dir
