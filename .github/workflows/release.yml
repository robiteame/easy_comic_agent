name: Release

# Multi-platform desktop release pipeline. Python runtime, ffmpeg and the
# Electron bundle are built as a matched set on each runner — no cross-arch
# builds, no macOS universal2 (native wheels do not ship universal2).
#
# Supply-chain gates (see docs/desktop-release-plan.md 阶段3):
#   1. the CI matrix (tests + typecheck + builds) must pass first;
#   2. tag releases must carry signing credentials — a public GitHub Release
#      may never ship unsigned / unnotarized installers;
#   3. every release carries SBOMs and sha256 checksums alongside the
#      installers.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases (never = dry-run, artifacts only)'
        type: choice
        default: never
        options: [never, always]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    # Security gate: run the full CI matrix before anything is built or
    # published. Tag pushes bypass branch protection, so this is the only
    # automated quality bar a release has.
    name: Test gate (CI matrix)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was retired in 2025-12; macos-15-intel is the last
          # Intel image. macos-14 deprecation starts 2026-07, so use macos-15.
          - name: macOS arm64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.14
          enable-cache: true

      # FFmpeg is compiled from source on macOS; the x86_64 asm objects need
      # nasm, which is not part of the runner image.
      - name: Install assembler toolchain (macOS ffmpeg build)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled Python runtime and ffmpeg
        run: pnpm --dir client run build:runtime

      - name: Build renderer and Electron main
        run: pnpm --dir client exec vite build

      - name: Verify signing credentials for tag releases
        # Dry-runs may stay unsigned; a public tag release may not.
        if: github.event_name == 'push'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              [ -n "${!var}" ] || missing+=("$var")
            done
          elif [ "$RUNNER_OS" = "Windows" ]; then
            for var in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
              [ -n "${!var}" ] || missing+=("$var")
            done
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Tag releases must be signed/notarized. Missing repo secrets: ${missing[*]}"
            echo "::error::Configure them in Settings → Secrets and Variables → Actions before pushing the tag."
            exit 1
          fi
          echo "Signing credentials present ($RUNNER_OS)."

      - name: Export signing credentials when present
        # Repo secrets that do not exist still reach a step as empty strings,
        # and electron-builder treats an empty CSC_LINK as "import this
        # certificate", hard-failing the unsigned macOS build with
        # ".../client not a file" (empty path resolves to the project dir).
        # Re-export only the vars that actually have a value so unsigned
        # builds skip signing entirely.
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done

      - name: Build installers
        # Tag pushes publish; workflow_dispatch defaults to a dry-run
        # (--publish never) so the pipeline can be validated end to end.
        run: pnpm --dir client exec electron-builder --publish ${{ github.event_name == 'push' && 'always' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarization vars come from the export step above and
          # exist only when the repo secrets are configured. The explicit
          # 'false' keeps unsigned builds from probing the runner keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate SBOM for the bundled runtime
        # Syft inventories the Python runtime, its site-packages and the
        # compiled ffmpeg — the parts no package manager manifest covers.
        uses: anchore/sbom-action@v0
        with:
          path: client/build
          format: cyclonedx-json
          artifact-name: sbom-runtime-${{ matrix.os }}.json

      - name: Generate dependency SBOMs (python lockfile + npm workspace)
        shell: bash
        run: |
          uvx --from cyclonedx-bom cyclonedx-py requirements \
            --requirement-file server/requirements.lock \
            --output-format JSON \
            --output-file server-deps-${{ matrix.os }}.sbom.json
          pnpm dlx @cyclonedx/cyclonedx-npm --output-file npm-deps-${{ matrix.os }}.sbom.json --omit-dev

      - name: Compute installer checksums
        shell: bash
        run: node client/scripts/artifact-hashes.mjs client/release --output "SHA256SUMS-${{ matrix.os }}.txt"

      - name: Attach checksums and SBOMs to the release
        # Matches the publish condition of the electron-builder step above.
        if: github.event_name == 'push' || inputs.publish == 'always'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # electron-builder publishes to v<package.json version> regardless
          # of the triggering ref, so target that tag explicitly — a dispatch
          # run on master would otherwise try to upload to a release named
          # "master".
          tag="v$(node -p "require('./client/package.json').version")"
          gh release upload "$tag" \
            "client/release/SHA256SUMS-${{ matrix.os }}.txt" \
            "server-deps-${{ matrix.os }}.sbom.json" \
            "npm-deps-${{ matrix.os }}.sbom.json" \
            --clobber

      - name: Upload installers as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            client/release/*.dmg
            client/release/*.zip
            client/release/*.exe
            client/release/*.blockmap
            client/release/SHA256SUMS-*.txt
            server-deps-*.sbom.json
            npm-deps-*.sbom.json
          if-no-files-found: error
